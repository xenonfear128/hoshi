name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: remoter
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: remoter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U remoter -d remoter_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test && npm --prefix web run build
      - run: npm --prefix web audit --audit-level=moderate
      - name: Create isolated SSH fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          mkdir -p /tmp/remoter-ci
          ssh-keygen -t ed25519 -N '' -f /tmp/remoter-ci/host_key -q
          ssh-keygen -t ed25519 -N '' -f /tmp/remoter-ci/client_key -q
          cp /tmp/remoter-ci/client_key.pub /tmp/remoter-ci/authorized_keys
          cat > /tmp/remoter-ci/sshd_config <<'CONFIG'
          Port 22222
          ListenAddress 127.0.0.1
          HostKey /tmp/remoter-ci/host_key
          AuthorizedKeysFile /tmp/remoter-ci/authorized_keys
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          StrictModes no
          PrintLastLog no
          PrintMotd no
          Subsystem sftp internal-sftp
          AllowUsers root
          CONFIG
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f /tmp/remoter-ci/sshd_config
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://remoter:integration-only@localhost:5432/remoter_test?sslmode=disable
          TEST_SSH_KEY: /tmp/remoter-ci/client_key
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build production container
        run: docker build -t remoter:ci .
      - name: Browser integration
        env:
          DATABASE_URL: postgres://remoter:integration-only@localhost:5432/remoter_test?sslmode=disable
          PUBLIC_ORIGIN: http://localhost:8080
          ALLOW_REGISTRATION: 'true'
          SSH_ALLOWED_CIDRS: 127.0.0.1/32
          TEST_SSH_KEY: /tmp/remoter-ci/client_key
        run: |
          export MASTER_KEY="$(openssl rand -base64 32)"
          go build -o /tmp/remoter-ci/app ./cmd/remoter
          /tmp/remoter-ci/app > /tmp/remoter-ci/app.log 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break || sleep 1; done
          cd web
          npx playwright install --with-deps chromium
          npm run test:e2e -- glass.spec.ts i18n.spec.ts ui-refinement.spec.ts ui-actions.spec.ts workspace.spec.ts
          # Fresh process resets the production registration limiter for phone fixtures.
          kill "$app_pid"
          wait "$app_pid" || true
          (cd .. && /tmp/remoter-ci/app > /tmp/remoter-ci/app.log 2>&1) &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break || sleep 1; done
          npm run test:e2e -- mobile.spec.ts

